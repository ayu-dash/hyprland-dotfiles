# Catppuccin Mocha Theme for Kitty
# ~/.config/hypr/Themes/CatppucinMocha/Kitty/kitty.conf

cursor_shape beam
cursor_trail 1

# ── Core ──────────────────────────────────────────────
foreground              #cdd6f4
background              #1e1e2e
background_opacity      0.95

# ── Cursor ────────────────────────────────────────────
cursor                  #f5e0dc
cursor_text_color       #11111b
cursor_shape            beam

# ── Selection ─────────────────────────────────────────
selection_foreground    #cdd6f4
selection_background    #45475a

# ── URL ───────────────────────────────────────────────
url_color               #89b4fa
url_style               single

# ── Window Border ─────────────────────────────────────
active_border_color     #cba6f7
inactive_border_color   #313244
bell_border_color       #f38ba8

# ── Tab Bar ───────────────────────────────────────────
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #bac2de
inactive_tab_background #181825
tab_bar_background      #11111b

# ── ANSI Colors ───────────────────────────────────────
# Black
color0                  #11111b
color8                  #313244

# Red
color1                  #f38ba8
color9                  #eba0ac

# Green
color2                  #a6e3a1
color10                 #b8e1b1

# Yellow
color3                  #f9e2af
color11                 #f8d9a0

# Blue
color4                  #89b4fa
color12                 #99c1f5

# Magenta
color5                  #f5c2e7
color13                 #f7d0eb

# Cyan
color6                  #94e2d5
color14                 #a8e8de

# White
color7                  #cdd6f4
color15                 #e5e9f0

# ── Mark Colors (for scrollback) ──────────────────────
mark1_foreground        #11111b
mark1_background        #cba6f7
mark2_foreground        #11111b
mark2_background        #a6e3a1
mark3_foreground        #11111b
mark3_background        #89b4fa
