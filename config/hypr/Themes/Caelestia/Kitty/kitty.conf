# Celestia Theme for Kitty
# ~/.config/hypr/Themes/Caelestia/Kitty/kitty.conf

cursor_shape beam
cursor_trail 1

# ── Core ──────────────────────────────────────────────
foreground              #e2e2e9
background              #0f1119
background_opacity      0.92

# ── Cursor ────────────────────────────────────────────
cursor                  #b4a0ff
cursor_text_color       #0f1119
cursor_shape            beam

# ── Selection ─────────────────────────────────────────
selection_foreground    #f0f0f8
selection_background    #33365c

# ── URL ───────────────────────────────────────────────
url_color               #7abaeb
url_style               single

# ── Window Border ─────────────────────────────────────
active_border_color     #b4a0ff
inactive_border_color   #2c2f44
bell_border_color       #f07085

# ── Tab Bar ───────────────────────────────────────────
active_tab_foreground   #0f1119
active_tab_background   #b4a0ff
inactive_tab_foreground #a3a4b1
inactive_tab_background #1a1c28
tab_bar_background      #0f1119

# ── ANSI Colors ───────────────────────────────────────
# Black
color0                  #0f1119
color8                  #2c2f44

# Red
color1                  #f07085
color9                  #ff8fa2

# Green
color2                  #7dd3a0
color10                 #a0f0c0

# Yellow
color3                  #f5c06b
color11                 #ffd68e

# Blue
color4                  #7abaeb
color12                 #9dd0f5

# Magenta
color5                  #b4a0ff
color13                 #d0c4ff

# Cyan
color6                  #6ed4da
color14                 #90e8ef

# White
color7                  #e2e2e9
color15                 #f0f0f8

# ── Mark Colors (for scrollback) ──────────────────────
mark1_foreground        #0f1119
mark1_background        #b4a0ff
mark2_foreground        #0f1119
mark2_background        #7dd3a0
mark3_foreground        #0f1119
mark3_background        #7abaeb
